{% extends "base_admin.html" %}
{% block title %}Students{% endblock %}
{% block content %}
<h1>Students</h1>
<p><a class="btn btn-primary" href="{{ url_for('admin.students_add') }}">Add Student</a></p>
<div class="card">
  <table>
    <thead>
      <tr><th>USN</th><th>Name</th><th>Department</th><th>Sem</th><th>Actions</th></tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.usn }}</td>
        <td>{{ s.full_name }}</td>
        <td>{{ s.department }}</td>
        <td>{{ s.semester }}</td>
        <td>
          <a href="{{ url_for('admin.students_edit', sid=s.id) }}">Edit</a>
          <form action="{{ url_for('admin.students_delete', sid=s.id) }}" method="post" style="display:inline" onsubmit="return confirm('Delete this student?');">
            <button type="submit" class="btn btn-danger" style="padding:0.25rem 0.5rem;font-size:0.8rem">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5">No students yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
